  #         cache: false

  run_single_experiment_clearml:
    cmd: python run_experiments_clearml.py
    deps:
    - data/processed/train.pkl
    - src/models/train_model_clearml.py
    - configs/conf/
    - src/utils/clearml_decorators.py
    - src/utils/clearml_experiment_utils.py
    params:
    - experiment
    - algorithm
    - data
    outs:
    - outputs_cm/
    - models/${experiment.run_name}.pkl
    metrics:
    - metrics/${experiment.run_name}_metrics.json:
        cache: false
    - logs/:
        cache: false

  run_all_experiments_clearml:
    cmd: python run_experiments_clearml.py --all
    deps:
      - data/processed/train.pkl
      - src/models/train_model_clearml.py
      - configs/conf/experiments/all_experiments.yaml
      - src/utils/clearml_experiment_utils.py
    outs:
      - experiments_results_clearml.csv
      - experiments_summary_clearml.json
      - models/best_model_clearml.pkl
      - experiments_comparison_clearml.csv
      - models_comparison_clearml.csv
      - clearml_dashboard.html
    metrics:
      - metrics_all/:
          cache: false


  evaluate_clearml:
    cmd: python src/evaluate/evaluate_clearml.py
    deps:
    - data/processed/test.pkl
    - models/best_model_clearml.pkl
    - src/evaluate/evaluate_clearml.py
    metrics:
    - evaluation/evaluation_metrics_clearml.json:
        cache: false

  report:
    cmd: poetry run python src/generate_report.py
    deps:
      - src/generate_report.py
      - metrics/
    outs:
      - docs/experiments.md
      - docs/assets/accuracy_comparison.png
      - docs/assets/f1_score_comparison.png
