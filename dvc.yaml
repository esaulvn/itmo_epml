stages:
  prepare:
    cmd: python src/data/prepare.py
    deps:
      - data/raw/dataset.csv
      - src/data/prepare.py
    outs:
      - data/processed/train.pkl
      - data/processed/test.pkl

  run_single_experiment:
    cmd: python run_experiments.py
    deps:
      - data/processed/train.pkl
      - src/models/train_model.py
      - configs/conf/
      - src/config/schema.py
      - src/monitoring/monitor.py
    params:
      - experiment
      - algorithm
      - data
      - mlflow
    outs:
      - outputs/
      - models/${experiment.run_name}.pkl
    metrics:
      - metrics/${experiment.run_name}_metrics.json:
          cache: true
      - logs/:
          cache: false

  run_all_experiments:
    cmd: python run_experiments.py --multirun
    deps:
      - data/processed/train.pkl
      - src/models/train_model.py
      - conf/experiments/all_experiments.yaml
    outs:
      - experiments_results.csv
      - experiments_summary.json
      - models/best_model.pkl
    metrics:
      - metrics_all/:
          cache: false

  evaluate:
    cmd: python src/evaluate/evaluate.py
    deps:
      - data/processed/test.pkl
      - models/best_model.pkl
      - src/evaluate/evaluate.py
    metrics:
      - evaluation/evaluation_metrics.json:
          cache: false