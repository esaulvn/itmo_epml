experiments:
  - name: "random_forest_basic"
    algorithm: "random_forest"
    hyperparameters:
      n_estimators: 100
      max_depth: 10
      min_samples_split: 2
      min_samples_leaf: 1
      random_state: 42
  
  - name: "random_forest_deep"
    algorithm: "random_forest"
    hyperparameters:
      n_estimators: 200
      max_depth: 20
      min_samples_split: 5
      min_samples_leaf: 2
      random_state: 42
  
  - name: "random_forest_light"
    algorithm: "random_forest"
    hyperparameters:
      n_estimators: 50
      max_depth: 5
      min_samples_split: 2
      min_samples_leaf: 1
      random_state: 42
  
  - name: "logistic_regression_basic"
    algorithm: "logistic_regression"
    hyperparameters:
      C: 1.0
      penalty: "l2"
      solver: "lbfgs"
      max_iter: 1000
      random_state: 42
  
  - name: "logistic_regression_strong"
    algorithm: "logistic_regression"
    hyperparameters:
      C: 0.1
      penalty: "l2"
      solver: "lbfgs"
      max_iter: 1000
      random_state: 42
  
  - name: "logistic_regression_weak"
    algorithm: "logistic_regression"
    hyperparameters:
      C: 10.0
      penalty: "l1"
      solver: "liblinear"
      max_iter: 1000
      random_state: 42
  
  - name: "xgboost_basic"
    algorithm: "xgboost"
    hyperparameters:
      n_estimators: 100
      learning_rate: 0.1
      max_depth: 6
      random_state: 42
  
  - name: "xgboost_fast"
    algorithm: "xgboost"
    hyperparameters:
      n_estimators: 50
      learning_rate: 0.2
      max_depth: 4
      random_state: 42
  
  - name: "xgboost_slow"
    algorithm: "xgboost"
    hyperparameters:
      n_estimators: 200
      learning_rate: 0.05
      max_depth: 8
      random_state: 42
  
  - name: "svm_basic"
    algorithm: "svm"
    hyperparameters:
      C: 1.0
      kernel: "rbf"
      gamma: "scale"
      random_state: 42
      tol: 0.01  
      max_iter: 100
  
  - name: "svm_linear"
    algorithm: "svm"
    hyperparameters:
      C: 1.0
      kernel: "linear"
      random_state: 42
      tol: 0.01  
      max_iter: 100
  
  - name: "svm_complex"
    algorithm: "svm"
    hyperparameters:
      C: 0.5
      kernel: "rbf"
      gamma: "auto"
      random_state: 42
      tol: 0.01  
      max_iter: 100
  
  - name: "knn_basic"
    algorithm: "knn"
    hyperparameters:
      n_neighbors: 5
      weights: "uniform"
      metric: "minkowski"
  
  - name: "knn_weighted"
    algorithm: "knn"
    hyperparameters:
      n_neighbors: 10
      weights: "distance"
      metric: "euclidean"
  
  - name: "knn_manhattan"
    algorithm: "knn"
    hyperparameters:
      n_neighbors: 7
      weights: "uniform"
      metric: "manhattan"

common_settings:
  data:
    test_size: 0.2
    random_state: 42
    preprocessing:
      drop_columns: ["customer_id"]
      encode_categorical: true
      scale_numerical: false
  
  mlflow:
    experiment_name: "loan_classification_experiments"
    tracking_uri: "http://localhost:5000"
    tags:
      dataset: "loan_dataset"
      author: "student"
      project: "hw1_epml"
    log_artifacts: true
    register_model: false