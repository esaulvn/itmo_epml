experiment:
  name: "binary_classification_loan"
  run_name: "random_forest_basic"

algorithm:
  name: "random_forest"
  class: "sklearn.ensemble.RandomForestClassifier"
  hyperparameters:
    n_estimators: 100
    max_depth: 10
    min_samples_split: 2
    min_samples_leaf: 1
    random_state: 42

data:
  test_size: 0.2
  random_state: 42
  preprocessing:
    drop_columns: ["customer_id"]
    encode_categorical: true
    scale_numerical: false

mlflow:
  tags:
    algorithm: "random_forest"
    version: "v1.0"
    dataset: "loan_dataset"
    author: "student"
  log_artifacts: true
  register_model: false