[tool.poetry]
name = "esaulvn-hw1-epml"
version = "0.1.0"
description = "HW1 project for EPML course"
authors = ["esaulvn <esaulovnata@gmail.com>"]
license = "MIT"
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"  
pandas = "^2.0.0"
numpy = "^2.1.2"
scikit-learn = "^1.3.0"
matplotlib = "^3.7.0"
seaborn = "^0.12.0"
jupyter = "^1.0.0"
python-dotenv = "^1.0.0"
loguru = "^0.7.0"
mlflow = "^3.7.0"
xgboost = "^1.7.0"
imbalanced-learn = "^0.11.0"
optuna = "^3.3.0" 
pyyaml = "^6.0"
plotly = "^5.15.0"
dvc = "^3.64.2"

[tool.poetry.group.dev.dependencies]
black = "^24.3.0"
isort = "^5.13.2"
ruff = "^0.3.4"
mypy = "^1.8.0"
bandit = "^1.7.7"
pre-commit = "^3.6.0"
ipython = "^8.10.0"

[tool.poetry.group.test.dependencies]
pytest = "^7.4.0"
pytest-cov = "^4.1.0"
pytest-mock = "^3.11.0"

[tool.poetry.group.docs.dependencies]
sphinx = "^7.0.0"
myst-parser = "^2.0.0"
sphinx-rtd-theme = "^1.3.0"

[tool.poetry.scripts]
train = "src.models.train_model:main"
predict = "src.models.predict_model:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ['py39', 'py310', 'py311']  

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
known_first_party = ["src"]

[tool.ruff]
target-version = "py311"  
line-length = 88

[lint]
select = [
    "E", "W", "F", "I", "B",
    "C4", "UP", "ASYNC", "RUF",
]
ignore = ["E501", "B008", "C901"]

[lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.11"  
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
exclude = "docs/"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=src --cov-report=term-missing"

